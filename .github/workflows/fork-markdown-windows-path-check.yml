name: Fork check - markdown Windows path links (fork only)
on:
  push:
    branches:
      - ci/markdown-windows-path-check
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Format check (changed files)
        working-directory: apps/mobile
        run: |
          dart format lib/features/file_peek/markdown_link_handler.dart test/markdown_link_handler_test.dart
          git --no-pager diff
          git diff --quiet
      - run: dart analyze .
        working-directory: apps/mobile
      - name: Targeted tests
        working-directory: apps/mobile
        run: flutter test test/markdown_link_handler_test.dart
      - name: Control - new tests must fail without the fix
        working-directory: apps/mobile
        run: |
          git checkout 69d266b8~1 -- lib/features/file_peek/markdown_link_handler.dart
          if flutter test test/markdown_link_handler_test.dart; then
            echo "Control run unexpectedly passed"
            exit 1
          fi
          echo "Control run failed as expected"
          git checkout HEAD -- lib/features/file_peek/markdown_link_handler.dart
      - name: Full mobile test suite
        working-directory: apps/mobile
        run: flutter test

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Flutter version from .mise.toml
        id: mise
        shell: pwsh
        run: |
          $mise = Get-Content .mise.toml -Raw
          if ($mise -notmatch 'flutter\s*=\s*"([^"]+)"') { Write-Error "no flutter version"; exit 1 }
          "flutter_version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: false
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build windows --release
        working-directory: apps/mobile
      - name: Smoke launch
        shell: pwsh
        run: |
          $exe = "apps/mobile/build/windows/x64/runner/Release/ccpocket.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "exited early: $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CC-Pocket-windows-x64-markdown-path-fix
          path: apps/mobile/build/windows/x64/runner/Release/
          retention-days: 14
